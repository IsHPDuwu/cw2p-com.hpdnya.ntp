[project]
name = "cw2p-com-hpdnya-ntp"
version = "0.1.3"
description = "Class Widgets 2 NTP plugin"
requires-python = ">=3.12"
dependencies = [
  "class-widgets-sdk>=0.5.1",
  "ntplib>=0.4.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["qml"]
